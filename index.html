<!doctype html>
<!--
  ==========================================================================
  ÍNDICE DO ARQUIVO (HTML)
  1. CONFIGURAÇÕES E METADADOS (<head>)
  2. CONTROLES DE INTERFACE (Tema)
  3. NAVEGAÇÃO EXTERNA (Botão Voltar)
  4. FUNDO INTERATIVO (Canvas)
  5. SEÇÃO PRINCIPAL (Container da Aplicação)
  6. RODAPÉ E SCRIPTS
  ==========================================================================
-->
<html lang="pt-BR">
  <head>
    <!-- 1. CONFIGURAÇÕES E METADADOS -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Previsão do Tempo & Relógio</title>
    <!-- Fonte moderna -->
    <link
      href="[https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap](https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap)"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="./img/fi-port.png" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Conectando o arquivo CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 2. CONTROLES DE INTERFACE: Botão para troca de tema (claro/escuro) -->
    <button
      id="theme-toggle-btn"
      class="theme-toggle-btn"
      title="Alternar Modo Claro/Escuro"
    >
      <i data-lucide="star" class="img-dark-mode"></i>
      <i data-lucide="star-off" class="img-light-mode"></i>
    </button>

    <!-- 3. NAVEGAÇÃO EXTERNA: Link para retorno ao hub principal -->
    <a
      href="https://brunojsilveira.vercel.app/#projects"
      class="back-portfolio-btn"
    >
      <i
        data-lucide="arrow-big-left-dash"
        style="width: 24px; height: 24px"
      ></i>
      <span>Voltar ao Portfolio</span>
    </a>

    <!-- 4. FUNDO INTERATIVO: Camada para animação de partículas -->
    <canvas id="bg-canvas"></canvas>

    <!-- 5. SEÇÃO PRINCIPAL: Interface do Horário e Clima -->
    <main class="container">
      <!-- LADO ESQUERDO: Interface da Data/Hora -->
      <section class="app-section clock-section">
        <h2 class="section-title">Tempo Local</h2>
        <div class="analog-clock">
          <!-- Marcadores de Hora -->
          <div class="marker star-marker pos-12"></div>
          <div class="marker dot-marker pos-1"></div>
          <div class="marker dot-marker pos-2"></div>
          <div class="marker star-marker pos-3"></div>
          <div class="marker dot-marker pos-4"></div>
          <div class="marker dot-marker pos-5"></div>
          <div class="marker star-marker pos-6"></div>
          <div class="marker dot-marker pos-7"></div>
          <div class="marker dot-marker pos-8"></div>
          <div class="marker star-marker pos-9"></div>
          <div class="marker dot-marker pos-10"></div>
          <div class="marker dot-marker pos-11"></div>

          <div class="hand hour-hand" id="hour-hand"></div>
          <div class="hand min-hand" id="min-hand"></div>
          <div class="hand sec-hand" id="sec-hand"></div>
          <div class="star-center"></div>
        </div>
        <div class="digital-info">
          <div id="time">00:00:00</div>
          <div id="date">Carregando data...</div>
        </div>
      </section>

      <!-- LADO DIREITO: Interface do Clima/Cidade -->
      <section class="app-section weather-section">
        <h2 class="section-title">Previsão Meteorológica</h2>
        <div id="city-name">Carregando clima...</div>

        <div class="weather-info">
          <div id="weather-icon">⏳</div>
          <div class="temp-container">
            <div id="temperature">--°C</div>
            <div id="description">Aguarde</div>
          </div>
        </div>

        <div class="search-box">
          <input
            type="text"
            id="city-input"
            placeholder="Digite uma cidade..."
            autocomplete="off"
          />
          <button id="search-btn">Buscar</button>
        </div>
      </section>
    </main>

    <!-- 6. RODAPÉ E SCRIPTS -->
    <footer>
      &copy; 2026 Bruno J. Silveira. Todos os direitos reservados.
    </footer>

    <!-- Conectando o arquivo JavaScript -->
    <script src="script.js" defer></script>
  </body>
</html>
