<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo & Relógio</title>
    
    <!-- Fonte moderna -->
    <link href="[https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap](https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap)" rel="stylesheet">
  
    <!-- Ícone da aba do navegador -->
    <link rel="icon" type="image/png" href="./img/fi-port.png">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script></head>
  
    <!-- Conectando o arquivo CSS -->
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <!-- Botão Voltar ao Portfolio -->
    <a href="https://brunojsilveira.vercel.app/" id="back-btn" onclick="window.close();" class="back-btn">
    <div class="btn-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left">
            <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
        </svg>
    </div>
    <span class="btn-text">Voltar ao Portfolio</span>
    </a>

    <!-- Canvas de Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Container Principal do App -->
    <div class="app-layout">
    
    <section class="container clock-container">
        <div id="time">00:00:00</div>
        <div id="date">Carregando data...</div>
    </section>

    <section class="container weather-container">
        <div id="city-name">Carregando clima...</div>
        
        <div class="weather-info">
            <div id="weather-icon">⏳</div>
            <div class="temp-container">
                <div id="temperature">--°C</div>
                <div id="description">Aguarde</div>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="city-input" placeholder="Digite uma cidade..." autocomplete="off">
            <button id="search-btn">Buscar</button>
        </div>
    </section>

    </div>
    
    <!-- Conectando o arquivo JavaScript -->
    <script src="script.js" defer></script>
</body>
</html>
