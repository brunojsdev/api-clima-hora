<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo & Relógio</title>
    <!-- Fonte moderna -->
    <link href="[https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap](https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap)" rel="stylesheet">
    <!-- Conectando o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Botão Voltar ao Portfolio -->
    <a href="https://brunojsdev.github.io/meu-portfolio/" class="back-portfolio-btn">
    <span>←</span> Voltar ao Portfolio
    </a>  
    
    <!-- Canvas de Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Container Principal do App -->
    <main class="container">
        
        <!-- Relógio -->
        <section class="clock-section">
            <div id="time">00:00:00</div>
            <div id="date">Carregando data...</div>
        </section>

        <!-- Clima -->
        <section class="weather-section">
            <div id="city-name">Carregando clima...</div>
            
            <div class="weather-info">
                <div id="weather-icon">⏳</div>
                <div class="temp-container">
                    <div id="temperature">--°C</div>
                    <div id="description">Aguarde</div>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="city-input" placeholder="Digite uma cidade..." autocomplete="off">
                <button id="search-btn">Buscar</button>
            </div>
        </section>

    </main>

    <!-- Conectando o arquivo JavaScript -->
    <script src="script.js" defer></script>
</body>
</html>
