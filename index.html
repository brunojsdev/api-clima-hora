<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora e Clima</title>
    
    <!-- Importação do arquivo de estilos externo -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="48x48" href="./img/fi-port.png">

</head>
<body>

    <!-- [ SEÇÃO 1: FUNDO ANIMADO ] 
         Este canvas será controlado pelo script.js para criar o efeito Digital Rain -->
    <canvas id="bg-canvas"></canvas>


    <!-- [ SEÇÃO 2: CONTAINER PRINCIPAL ] 
         Centraliza todos os widgets da aplicação -->
    <main class="dashboard-panel">
        
        <!-- Bloco do Relógio Digital -->
        <section class="clock-module">
            <div class="time-display">
                <!-- Horas -->
                <div class="time-block">
                    <span class="time-val" id="hrs">00</span>
                    <span class="time-label">HORAS</span>
                </div>

                <span class="time-colon">:</span>

                <!-- Minutos -->
                <div class="time-block">
                    <span class="time-val" id="min">00</span>
                    <span class="time-label">MINUTOS</span>
                </div>

                <span class="time-colon">:</span>

                <!-- Segundos -->
                <div class="time-block">
                    <span class="time-val" id="sec">00</span>
                    <span class="time-label">SEGUNDOS</span>
                </div>
            </div>

            <!-- Exibição da Data Completa -->
            <div class="date-display" id="date">CARREGANDO DATA...</div>
        </section>


        <!-- Bloco de Informações Climáticas -->
        <section class="weather-module">
            <div class="weather-info">
                <!-- Ícone representativo do clima -->
                <div class="w-icon" id="w-icon">⛅</div>
                
                <div class="w-details">
                    <!-- Temperatura com cor Amarelo Pistache -->
                    <span class="w-temp" id="w-temp">24°C</span>
                    <!-- Localização fixa -->
                    <span class="w-city">São Bernardo do Campo</span>
                </div>
            </div>

            <!-- Botão de Interação -->
            <button class="btn-update" id="btn-update" onclick="fetchWeather()">
                atualizar
            </button>
        </section>

    </main>

    <!-- Importação do arquivo de lógica externa -->
    <script src="script.js"></script>
</body>
</html>
